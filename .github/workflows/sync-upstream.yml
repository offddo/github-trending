name: Sync from upstream

on:
  schedule:
    # UTC 04:17 = 北京时间 12:17，等原作者当天 (~UTC 03:00) 提交后再同步
    - cron: '17 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream master
        run: |
          git remote add upstream https://github.com/bonfy/github-trending.git 2>/dev/null \
            || git remote set-url upstream https://github.com/bonfy/github-trending.git
          git fetch upstream master

      - name: Rebase onto upstream
        run: git rebase upstream/master

      - name: Push to origin
        run: git push origin master --force
